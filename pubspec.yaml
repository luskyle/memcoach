name: shiyi
description: Memcoach 记忆教练 —— 把你想记住的任何东西收进来，它会在对的时间提醒你复习。
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理（技术调研选型：Riverpod）
  flutter_riverpod: ^2.6.1
  # 本地存储（drift/SQLite）
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  # 图表（遗忘曲线 / 热力图）
  fl_chart: ^1.1.1
  # 设置 KV 与轻量缓存
  shared_preferences: ^2.5.3
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  # 导出 zip（元数据 + JSON）
  archive: ^4.0.0
  # 发音：系统 TTS（iOS AVSpeechSynthesizer / Android / 桌面视引擎）
  flutter_tts: ^4.2.0
  # 打开网页原文（收藏出处回看）
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - lib/assets/dictionary/
    - lib/assets/poetry/
    - lib/assets/content/