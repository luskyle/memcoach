name: Release

# 版本发布：推送 v* 标签自动触发；也可 workflow_dispatch 手动指定标签。
# 流程：质量门禁 → 三端构建（Android APK / Linux tar.gz / iOS 未签名 ipa）
#      → 自动生成中文发布说明 → 发布 GitHub Release（含全部产物）。
# Android 正式签名：仓库 Secrets 配置（缺省时自动退化为 debug 签名发布）：
#   ANDROID_KEYSTORE         base64 编码的 .jks 文件
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# iOS 签名：需要 Apple 证书 Secrets（MATCH/证书链），当前 CI 产出未签名包。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 版本标签（如 v0.2.0）；push tag 触发时自动使用 tag 名
        required: false

permissions:
  contents: write

jobs:
  quality:
    name: 质量门禁（analyze + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: 构建 Android APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: 准备正式签名（无 Secrets 时跳过，回退 debug 签名）
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_B64}" ]; then
            echo "${ANDROID_KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "已使用正式签名"
          else
            echo "未配置签名 Secrets，使用 debug 签名（正式发布请配置）"
          fi
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    name: 构建 Linux 桌面
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 安装桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          tar -C build/linux/x64/release -czf memcoach-linux-x64.tar.gz bundle
          ls -lh memcoach-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: memcoach-linux-x64.tar.gz

  build-ios:
    name: 构建 iOS（未签名）
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign
      - name: 打包 Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr ../../../memcoach-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: memcoach-ios-unsigned.zip

  release:
    name: 生成发布说明并发布 Release
    needs: [build-android, build-linux, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史与标签（发布说明依赖 git log）
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: 确定版本标签
        id: tag
        run: |
          TAG=""
          if [[ "$GITHUB_REF_NAME" == v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          [ -z "$TAG" ] && TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "无法确定版本标签：请推送 v* 标签或通过 workflow_dispatch 传入 tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 校验 pubspec 版本与标签一致（仅提示）
        run: |
          PUB_VER=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          echo "pubspec version: $PUB_VER，标签: ${{ steps.tag.outputs.tag }}"
      - name: 生成发布说明
        run: |
          bash scripts/gen_release_notes.sh "${{ steps.tag.outputs.tag }}" > notes.md
          head -60 notes.md
      - name: 创建/更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          ASSETS=$(find assets -type f -name "*.apk" -o -type f -name "*.zip" -o -type f -name "*.tar.gz" | tr '\n' ' ')
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 标签已存在 → 更新说明并补充资产（重跑场景）
            gh release upload "$TAG" $ASSETS --clobber
            gh release edit "$TAG" --title "Memcoach $TAG" --notes-file notes.md
          else
            gh release create "$TAG" $ASSETS --title "Memcoach $TAG" --notes-file notes.md
          fi